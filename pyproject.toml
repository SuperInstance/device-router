[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "device-router"
version = "0.1.0"
description = "Heterogeneous compute router — auto-detect CUDA, iGPU, CPU, NPU and route ML workloads optimally"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "SuperInstance"}]
keywords = ["cuda", "gpu", "device-routing", "heterogeneous-compute", "ml"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "psutil>=5.0",
]

[project.optional-dependencies]
cuda = ["torch"]
directml = ["torch-directml"]
npu = []
all = ["torch", "torch-directml"]
dev = ["pytest>=7.0", "numpy"]

[tool.setuptools.packages.find]
include = ["device_router*"]
